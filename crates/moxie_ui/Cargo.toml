[package]
name = "moxie_ui"
description = "Reusable UI elements and theming for the MotionGfx editor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "./README.md"
autoexamples = false

[dependencies]
bevy_fynix = { workspace = true }
bevy_motiongfx = { workspace = true }
fynix = { workspace = true }
# `#[element]` derives `Lenz`, whose output names this crate.
lenz = { workspace = true }
moxie_asset = { workspace = true }
bevy = { workspace = true, default-features = true, features = [
    "bevy_ui_widgets",
] }

[lints]
workspace = true

[[example]]
name = "inspector_demo"
path = "examples/inspector_demo.rs"
