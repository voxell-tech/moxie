[package]
name = "fynix_proto"
description = "Backend-agnostic core of the fynix rewrite prototype, see docs/fynix_rewrite.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
typarena = { version = "0.1.2", features = ["send", "sync"] }
# `std`: its integer interpolation does not build without it.
motiongfx_interp = { version = "0.3.1" }
hashbrown = { version = "0.17", default-features = false, features = [
    "default-hasher",
] }

[lints]
workspace = true
