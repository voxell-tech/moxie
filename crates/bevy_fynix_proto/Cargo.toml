[package]
name = "bevy_fynix_proto"
description = "Bevy backend of the fynix rewrite prototype, see docs/fynix_rewrite.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fynix_proto = { path = "../fynix_proto" }
motiongfx_interp = { version = "0.3.1" }
bevy_app = { version = "0.19", default-features = false }
bevy_asset = { version = "0.19", default-features = false }
bevy_color = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_image = { version = "0.19", default-features = false }
bevy_math = { version = "0.19", default-features = false }
bevy_picking = { version = "0.19", default-features = false }
bevy_text = { version = "0.19", default-features = false }
bevy_time = { version = "0.19", default-features = false }
bevy_ui = { version = "0.19", default-features = false }
bevy_ui_widgets = { version = "0.19", default-features = false }

[dev-dependencies]
# Only for the windowed `gallery` example; the crate itself stays on
# the sub-crates above.
bevy = { workspace = true, default-features = true, features = [
    "bevy_ui_widgets",
] }

[lints]
workspace = true
