[package]
name = "bevy_fynix_proto"
description = "Bevy backend of the fynix rewrite prototype, see docs/fynix_rewrite.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fynix_proto = { path = "../fynix_proto" }
motiongfx_interp = { version = "0.3.1" }
bevy = { workspace = true, features = [
    "bevy_picking",
    "bevy_ui_widgets",
    "bevy_window",
] }

[dev-dependencies]
# Only for the windowed `gallery` example and the tests; the library
# itself builds with the features above alone.
bevy = { workspace = true, default-features = true }

[lints]
workspace = true
