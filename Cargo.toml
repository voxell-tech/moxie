[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/moxie"

[workspace.dependencies]
# moxie
moxie = { version = "0.1.0", path = "crates/moxie" }
moxie_ui = { version = "0.1.0", path = "crates/moxie_ui" }
moxie_asset = { version = "0.1.0", path = "crates/moxie_asset" }

# motiongfx - the `moxie` branch until it lands on `main`
bevy_motiongfx = { git = "https://github.com/voxell-tech/motiongfx", branch = "moxie", default-features = false }
motiongfx_scene = { git = "https://github.com/voxell-tech/motiongfx", branch = "moxie", default-features = false }
motiongfx_interp = { version = "0.3.0", default-features = false }

# fynix
fynix = { git = "https://github.com/voxell-tech/fynix" }
bevy_fynix = { git = "https://github.com/voxell-tech/fynix" }

# bevy
bevy = { version = "0.19", default-features = false }

# other
serde = { version = "1", default-features = false }
ron = { version = "0.12", default-features = false, features = ["std"] }
rfd = "0.15"

[workspace.lints.clippy]
redundant_type_annotations = "warn"

# `fynix` takes `motiongfx_interp` from crates.io while `bevy_motiongfx`
# builds it from the `moxie` branch, and the editor bridges the two. Pin
# every `motiongfx_interp` to one local checkout so there is a single
# copy. Needs `motiongfx` checked out beside this repo on the `moxie`
# branch.
[patch.crates-io]
motiongfx_interp = { path = "../motiongfx/crates/motiongfx_interp" }

[patch."https://github.com/voxell-tech/motiongfx"]
motiongfx_interp = { path = "../motiongfx/crates/motiongfx_interp" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
