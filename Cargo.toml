[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/moxie"

[workspace.dependencies]
# moxie
moxie = { version = "0.1.0", path = "crates/moxie" }
moxie_ui = { version = "0.1.0", path = "crates/moxie_ui" }
moxie_asset = { version = "0.1.0", path = "crates/moxie_asset" }

# motiongfx
bevy_motiongfx = { version = "0.3.1", features = ["scene"] }
motiongfx_scene = "0.3.1"

# fynix
fynix = { git = "https://github.com/voxell-tech/fynix" }
bevy_fynix = { git = "https://github.com/voxell-tech/fynix" }

# bevy
bevy = { version = "0.19", default-features = false }

# other
serde = { version = "1", default-features = false }
ron = { version = "0.12", default-features = false, features = ["std"] }
rfd = "0.15"

[workspace.lints.clippy]
redundant_type_annotations = "warn"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
