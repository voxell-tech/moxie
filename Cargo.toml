[workspace]
resolver = "2"
members = ["crates/*"]
# Vendored crates are their own workspaces; keep them out of this one.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/moxie"

[workspace.dependencies]
# moxie
moxie = { version = "0.1.0", path = "crates/moxie" }
moxie_ui = { version = "0.1.0", path = "crates/moxie_ui" }
moxie_asset = { version = "0.1.0", path = "crates/moxie_asset" }

# motiongfx
bevy_motiongfx = { version = "0.3.1", features = ["scene"] }
motiongfx_scene = "0.3.1"

# fynix
fynix = { git = "https://github.com/voxell-tech/fynix" }
bevy_fynix = { git = "https://github.com/voxell-tech/fynix" }

# fynix macros
lenz = { version = "0.1.0", default-features = false }

# bevy
bevy = { version = "0.19", default-features = false }

# other
serde = { version = "1", default-features = false }
ron = { version = "0.12", default-features = false, features = ["std"] }
rfd = "0.15"

[workspace.lints.clippy]
redundant_type_annotations = "warn"


[patch.crates-io]
motiongfx = { path = "vendor/motiongfx/crates/motiongfx" }
motiongfx_interp = { path = "vendor/motiongfx/crates/motiongfx_interp" }
motiongfx_scene = { path = "vendor/motiongfx/crates/motiongfx_scene" }
bevy_motiongfx = { path = "vendor/motiongfx/crates/bevy_motiongfx" }

# fynix takes `motiongfx_interp` from git until it is released.
[patch."https://github.com/voxell-tech/motiongfx"]
motiongfx_interp = { path = "vendor/motiongfx/crates/motiongfx_interp" }

[patch."https://github.com/voxell-tech/fynix"]
fynix = { path = "vendor/fynix/crates/fynix" }
bevy_fynix = { path = "vendor/fynix/crates/bevy_fynix" }


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
